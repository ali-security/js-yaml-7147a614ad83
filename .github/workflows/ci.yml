name: CI

on:
  workflow_dispatch:
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['23', '12', '14']

    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2025-11-12T15%3A18%3A03.524000Z@time-machines-npm.sealsecurity.io/
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Pin npm registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-11-12T15:18:03.524000Z

      - run: npm install

    # dist/ is committed but shipped as-is by `npm pack --ignore-scripts`, so the
    # bundles have to be rebuilt from the patched sources or they keep serving
    # unpatched code to `import`/browser consumers.
      - run: npm run browserify

      - run: npm test

  package:

    runs-on: ubuntu-latest

    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2025-11-12T15%3A18%3A03.524000Z@time-machines-npm.sealsecurity.io/
      - uses: actions/checkout@v4

      - name: Use Node.js 23
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Pin npm registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-11-12T15:18:03.524000Z

      - run: npm install

    # Rebuild dist/ from the patched sources; `npm pack --ignore-scripts` would
    # otherwise pack the stale committed bundles.
      - run: npm run browserify

      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
